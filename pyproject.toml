[project]
name = "uber-lite"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pyspark (>=4.2.0,<5.0.0)",
    "kafka-python-ng (>=2.2.3,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "sodapy (>=2.2.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ['py312']


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]
